<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Yay!</title>
  <style>
    body{
      margin:0; height:100vh; display:grid; place-items:center;
      background: radial-gradient(circle at top, #dcfce7, #ffffff);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      color:#065f46;
      text-align:center;
      padding:24px;
    }
    .wrap{
      width:min(720px, 94vw);
      background:white;
      border-radius:24px;
      padding:28px 18px;
      box-shadow: 0 18px 50px rgba(0,0,0,.12);
    }
    h1{ font-size: clamp(34px, 5vw, 56px); margin: 8px 0 10px; }
    p{ margin:0 0 18px; opacity:.8; }
    img{
      width:min(520px, 100%);
      border-radius:18px;
      box-shadow: 0 10px 30px rgba(0,0,0,.18);
    }
    .small{ font-size:14px; opacity:.6; margin-top:14px; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Yay!! 🥰</h1>
    <p>You just made my day 💚</p>

    <!-- Funny meme GIF (public hotlink). Swap this URL to any meme image/GIF you prefer. -->
    <img
      alt="funny valentine meme"
      src="https://media.giphy.com/media/3oriO0OEd9QIDdllqo/giphy.gif"
    />

    <div class="small">Happy Valentine’s 💘</div>
  </div>
</body>
</html>
